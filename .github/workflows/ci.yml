name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          shopt -s nullglob
          for req in agents/*/requirements.txt mcp-servers/*/requirements.txt; do
            pip install -r "$req"
          done
          for req in agents/*/requirements-dev.txt mcp-servers/*/requirements-dev.txt; do
            pip install -r "$req"
          done
      - run: ruff check .
      - run: pytest -q
